; llama.cpp router presets for TaskBridge (--models-preset).
;
; Section names become the model ids clients see, so Pi shows them as
; `llama.cpp/<section>`. Option names are the long CLI flags WITHOUT leading
; dashes (`ctx-size`, `n-gpu-layers`, `mmproj`, `cache-type-k`, ...).
;
; IMPORTANT: --models-max / --models-autoload and --host/--port are router-level
; flags and must be passed on the command line, not inside this file.
;
; The device/split/KV flags below are not cosmetic: without them a 27B Q4 on a
; 16 GB card processes the prompt at ~20-130 tok/s. With them we measured
; PP ~1400 tok/s and TG ~44 tok/s (RTX 5070 Ti).
;
; Copy to models.ini (git-ignored), fix the paths, then point
; localRuntime.router.args at it:
;   "--models-preset", "G:\\Android\\AndroidStudioProjects\\Taskbridge\\models.ini"

version = 1

[*]
n-gpu-layers = 999
threads = 16
threads-batch = 16
batch-size = 512
ubatch-size = 256
parallel = 1
cache-type-k = q4_0
cache-type-v = q4_0
fit = off
flash-attn = on
jinja = true
reasoning = on
reasoning-effort = medium
no-reasoning-preserve = true
temp = 0.6
top-k = 20
top-p = 0.95
min-p = 0.0
repeat-penalty = 1.0
presence-penalty = 0.52
frequency-penalty = 0.0
stop-timeout = 20
; PP (prompt) / TG (generation) tok/s for the UI come from llama.cpp /metrics;
; without --metrics the endpoint answers 501 and TaskBridge shows "нет данных".
metrics = true

; Vision preset: base model plus its multimodal projector, so llama.cpp reports
; input_modalities ["text","image"] and Pi marks the model as vision.
[qwen-27b-vision]
model = G:\AIModels\lmstudio\unsloth\Qwen3.8-27B-GGUF\Qwen3.8-27B-UD-IQ4_XS.gguf
mmproj = G:\AIModels\lmstudio\unsloth\Qwen3.8-27B-GGUF\mmproj-BF16.gguf
ctx-size = 33792
reasoning-budget = 4096
device = CUDA0
split-mode = none
main-gpu = 0
load-mode = none
cache-prompt = true

; Text-only presets (no mmproj).
[qwen-27b-text]
model = G:\AIModels\lmstudio\unsloth\Qwen3.8-27B-GGUF\Qwen3.8-27B-UD-IQ4_XS.gguf
no-mmproj = true
ctx-size = 65536
reasoning-budget = 6144

; Q3 + mmproj, ctx 56320 — параметры после автотюна (vision).
[qwen-27b-q3-vision]
model = G:\AIModels\lmstudio\unsloth\Qwen3.8-27B-GGUF\Qwen3.8-27B-UD-Q3_K_XL.gguf
mmproj = G:\AIModels\lmstudio\unsloth\Qwen3.8-27B-GGUF\mmproj-BF16.gguf
ctx-size = 56320
device = CUDA0
split-mode = none
main-gpu = 0
load-mode = none
cache-prompt = true

[qwen-27b-q3]
model = G:\AIModels\lmstudio\unsloth\Qwen3.8-27B-GGUF\Qwen3.8-27B-UD-Q3_K_XL.gguf
