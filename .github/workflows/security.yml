# Server-side copy of the local gate.
#
# The hooks are the first two lines of defence, but they can be bypassed with
# `--no-verify` and they do not exist at all in a fresh clone. This job runs on
# GitHub's side, where a developer's machine cannot switch it off.
#
# Verified by running it: runs 36536611902 and 36536717780 passed on master with
# every step executing (`✔ every path…`, `✔ no secret…`, `# pass 23`). Re-read the
# run after any change here; this file is not self-testing.
#
# The actions are pinned to full commit SHAs, so a moved tag cannot change what
# runs. The comment names the version each SHA corresponds to; refresh both
# together and read the run afterwards.
#
# The corporate term list is deliberately NOT passed to CI. This job executes
# scripts from the repository it is checking, so a secret handed to it is a
# secret a modified scanner could print or send away — the check would become the
# leak channel. That list stays local, where `pre-push` fails closed without it.
#
# This job does NOT make itself required. Branch protection / rulesets are not
# available on private repositories without a paid plan, so while TaskBridge is
# private this is a visible check, not a blocking one.
name: security-policy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # --history walks the whole reachable history, so a shallow clone would
          # make the check quietly weaker.
          fetch-depth: 0
          # Nothing here pushes, and the token should not sit in .git/config.
          persist-credentials: false

      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Repo policy over the whole history
        run: node scripts/repo-policy.mjs --history

      - name: Secret audit
        run: node scripts/check-secrets.mjs

      - name: Policy unit tests
        run: node --test tests/repo-policy.test.mjs tests/cloud-upload-set.test.mjs
